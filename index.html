<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: transparent; display: flex; justify-content: center; padding: 10px 0; }
    .container { width: 100%; max-width: 280px; display: flex; flex-direction: column; gap: 12px; }
    .card-trm { background: #06182c; color: white; padding: 22px; border-radius: 12px; text-align: center; border: 1px solid #102a43; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #829ab1; font-weight: 700; margin-bottom: 8px; }
    .value { font-size: 30px; font-weight: 800; color: #ffffff; white-space: nowrap; margin-bottom: 5px; }
    .vigencia { font-size: 11px; color: #4fd1c5; font-weight: 600; padding: 4px 12px; background: rgba(79, 209, 197, 0.1); border-radius: 20px; display: inline-block; }
    .card-calc { background: #0a192f; padding: 15px; border-radius: 12px; border: 1px solid #102a43; }
    .input-row { margin-bottom: 12px; text-align: left; }
    .input-row label { display: block; font-size: 9px; color: #627d98; margin-bottom: 4px; text-transform: uppercase; }
    .input-row input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #1e293b; background: #112240; color: white; font-size: 16px; box-sizing: border-box; outline: none; }
    .footer { font-size: 8px; color: #475569; text-align: center; margin-top: 10px; border-top: 1px solid #1e293b; padding-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card-trm">
      <div class="label" id="fuente-label">TRM OFICIAL</div>
      <div class="value" id="trm-val">$ 0.000,00</div>
      <div class="vigencia" id="trm-date">Actualizando...</div>
    </div>
    <div class="card-calc">
      <div class="input-row">
        <label>Dólares (USD)</label>
        <input type="number" id="usd" placeholder="0.00" oninput="convertir()">
      </div>
      <div class="input-row">
        <label>Pesos (COP)</label>
        <input type="text" id="cop" placeholder="$ 0" readonly>
      </div>
      <div class="footer">Actualizado: <span id="trm-time">--:--</span></div>
    </div>
  </div>
  <script>
    let currentRate = 0;
    function update() {
      fetch("https://curly-violet-2d33.cdiaz-sac.workers.dev/?v=" + Date.now())
        .then(r => r.json())
        .then(data => {
          if (data.trm) {
            currentRate = data.trm;
            document.getElementById('trm-val').innerText = "$ " + data.trm_str;
            document.getElementById('trm-date').innerText = "Vigencia: " + data.fecha;
            document.getElementById('fuente-label').innerText = data.fuente;
            document.getElementById('trm-time').innerText = data.hora;
          }
        });
    }
    function convertir() {
      const usdValue = document.getElementById('usd').value;
      const copInput = document.getElementById('cop');
      if (usdValue > 0 && currentRate > 0) {
        const total = Math.round(usdValue * currentRate);
        copInput.value = "$ " + new Intl.NumberFormat('es-CO').format(total);
      } else { copInput.value = ""; }
    }
    update();
    setInterval(update, 600000);
  </script>
</body>
</html>
