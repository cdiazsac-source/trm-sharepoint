<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget TRM Colombia</title>
  <style>
    :root {
      --primary: #06182c;
      --accent: #00f2fe;
      --text-muted: #829ab1;
      --bg-input: #112240;
    }
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: transparent; display: flex; justify-content: center; padding: 10px; }
    .container { width: 100%; max-width: 280px; display: flex; flex-direction: column; gap: 12px; }
    
    /* Tarjeta Principal */
    .card { background: var(--primary); color: white; padding: 25px 15px; border-radius: 16px; text-align: center; border: 1px solid #102a43; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); font-weight: 700; margin-bottom: 8px; }
    .value { font-size: 38px; font-weight: 800; color: #ffffff; margin: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    .vigencia { font-size: 11px; color: var(--accent); margin-top: 8px; font-weight: 600; }

    /* Calculadora */
    .calc-box { background: #0a192f; color: white; padding: 20px; border-radius: 16px; border: 1px solid #102a43; }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; font-weight: 700; }
    .input-group input { 
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; 
      background: var(--bg-input); color: white; font-size: 16px; box-sizing: border-box; 
      outline: none; transition: all 0.3s;
    }
    .input-group input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(0,242,254,0.2); }

    /* Footer */
    .footer { font-size: 10px; color: #627d98; text-align: center; margin-top: 10px; line-height: 1.5; }
    .footer b { color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container">
    <!-- Visualización TRM -->
    <div class="card">
      <div class="label">TRM Oficial Colombia</div>
      <div class="value" id="trm-display">$ 0,00</div>
      <div class="vigencia" id="fecha-display">Sincronizando...</div>
    </div>

    <!-- Calculadora Dual -->
    <div class="calc-box">
      <div class="input-group">
        <label>Dólares (USD)</label>
        <input type="number" id="usd" placeholder="0.00" oninput="convertir('usd')">
      </div>
      <div class="input-group">
        <label>Pesos (COP)</label>
        <input type="text" id="cop" placeholder="0" oninput="convertir('cop')">
      </div>
      <div class="footer">
        Fuente: <span id="fuente">Cargando...</span><br>
        Sincronizado: <span id="hora">--:--</span>
      </div>
    </div>
  </div>

  <script>
    let trmGlobal = 0;
    // URL de tu Worker de Cloudflare
    const WORKER_URL = "https://curly-violet-2d33.cdiaz-sac.workers.dev/";

    function format(n) { return new Intl.NumberFormat('es-CO').format(n); }

    async function updateData() {
      try {
        const response = await fetch(WORKER_URL + "?cb=" + Date.now());
        const data = await response.json();
        
        if(data.trm) {
          trmGlobal = parseFloat(data.trm);
          document.getElementById('trm-display').innerText = "$ " + format(trmGlobal);
          document.getElementById('fecha-display').innerText = "Vigencia: " + (data.fecha || "Hoy");
          document.getElementById('fuente').innerText = data.fuente;
          document.getElementById('hora').innerText = data.hora;
        }
      } catch (e) {
        console.error("Error al obtener datos");
      }
    }

    function convertir(tipo) {
      if(trmGlobal === 0) return;
      const usdIn = document.getElementById('usd');
      const copIn = document.getElementById('cop');
      
      if (tipo === 'usd') {
        let val = usdIn.value;
        copIn.value = val > 0 ? format(Math.round(val * trmGlobal)) : "";
      } else {
        // Limpiar el formato de miles para calcular
        let valPuro = copIn.value.replace(/\./g, '').replace(/,/g, '.');
        usdIn.value = valPuro > 0 ? (valPuro / trmGlobal).toFixed(2) : "";
      }
    }

    // Actualizar al cargar
    updateData();
    // Actualizar automáticamente cada 60 minutos
    setInterval(updateData, 3600000);
  </script>

</body>
</html>
