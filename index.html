<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root { --accent: #00f2fe; --bg: #06182c; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: transparent; display: flex; justify-content: center; padding: 10px; }
    .container { width: 100%; max-width: 280px; display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--bg); color: white; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #102a43; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
    .label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #829ab1; font-weight: 700; margin-bottom: 5px; }
    .value { font-size: 36px; font-weight: 800; color: #ffffff; margin: 5px 0; }
    .vigencia { font-size: 11px; color: var(--accent); font-weight: 600; }
    .calc-box { background: #0a192f; padding: 18px; border-radius: 15px; border: 1px solid #102a43; color: white; }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 9px; color: #627d98; margin-bottom: 4px; text-transform: uppercase; font-weight: 700; }
    .input-group input { 
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #1e293b; 
      background: #112240; color: white; font-size: 16px; box-sizing: border-box; outline: none; 
    }
    .input-group input:focus { border-color: var(--accent); }
    .footer { font-size: 9px; color: #627d98; text-align: center; margin-top: 10px; border-top: 1px solid #102a43; padding-top: 8px; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="label">TRM Oficial Colombia</div>
      <div id="trm-display" class="value">$ 0,00</div>
      <div id="fecha-display" class="vigencia">Sincronizando...</div>
    </div>

    <div class="calc-box">
      <div class="input-group">
        <label>Dólares (USD)</label>
        <input type="number" id="usd" step="0.01" placeholder="0.00" oninput="convertir('usd')">
      </div>
      <div class="input-group">
        <label>Pesos (COP)</label>
        <input type="text" id="cop" placeholder="0,00" oninput="convertir('cop')">
      </div>
      <div class="footer">
        Fuente: <span id="fuente">---</span><br>
        Sincronizado: <span id="hora">--:--</span>
      </div>
    </div>
  </div>

  <script>
    let trmGlobal = 0;
    const WORKER_URL = "https://curly-violet-2d33.cdiaz-sac.workers.dev/";

    // Formato moneda Colombia: 2 decimales siempre
    const formatter = new Intl.NumberFormat('es-CO', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

    async function fetchData() {
      try {
        // El "?cb=" + Date.now() rompe el caché del navegador para que no se congele
        const response = await fetch(WORKER_URL + "?cb=" + Date.now());
        const data = await response.json();
        
        if(data.trm) {
          trmGlobal = parseFloat(data.trm);
          document.getElementById('trm-display').innerText = "$ " + formatter.format(trmGlobal);
          document.getElementById('fecha-display').innerText = "Vigencia: " + data.fecha;
          document.getElementById('fuente').innerText = data.fuente;
          document.getElementById('hora').innerText = data.hora;
        }
      } catch (e) {
        console.log("Error de conexión");
      }
    }

    function convertir(tipo) {
      if(trmGlobal === 0) return;
      const usdIn = document.getElementById('usd');
      const copIn = document.getElementById('cop');
      
      if (tipo === 'usd') {
        let val = parseFloat(usdIn.value);
        copIn.value = val > 0 ? formatter.format(val * trmGlobal) : "";
      } else {
        // Limpiar puntos de miles para poder calcular
        let valPuro = copIn.value.replace(/\./g, '').replace(/,/g, '.');
        usdIn.value = valPuro > 0 ? (parseFloat(valPuro) / trmGlobal).toFixed(2) : "";
      }
    }

    // Ejecutar al cargar
    fetchData();
    // Auto-actualizar cada 30 minutos para evitar que se quede congelado
    setInterval(fetchData, 1800000);
  </script>
</body>
</html>
