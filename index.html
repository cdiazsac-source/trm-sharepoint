<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    :root { --accent: #00f2fe; --bg: #06182c; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: transparent; display: flex; justify-content: center; padding: 10px; overflow: hidden; }
    .container { width: 100%; max-width: 280px; display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--bg); color: white; padding: 22px; border-radius: 15px; text-align: center; border: 1px solid #102a43; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
    .label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #829ab1; font-weight: 700; margin-bottom: 5px; }
    .value { font-size: 34px; font-weight: 800; color: #ffffff; margin: 5px 0; }
    .vigencia { font-size: 11px; color: var(--accent); font-weight: 600; }
    .calc { background: #0a192f; padding: 18px; border-radius: 15px; border: 1px solid #102a43; color: white; }
    input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #1e293b; background: #112240; color: white; font-size: 16px; box-sizing: border-box; outline: none; margin-top: 5px; }
    .footer { font-size: 9px; color: #627d98; text-align: center; margin-top: 10px; line-height: 1.4; border-top: 1px solid #102a43; padding-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="label">TRM OFICIAL COLOMBIA</div>
      <div id="trm-display" class="value">Cargando...</div>
      <div id="fecha-display" class="vigencia">Sincronizando...</div>
    </div>
    <div class="calc">
      <input type="number" id="usd" placeholder="Dólares (USD)" oninput="convertir('usd')">
      <input type="text" id="cop" placeholder="Pesos (COP)" oninput="convertir('cop')">
      <div class="footer">
        Fuente: <span id="fuente">Buscando dato...</span><br>
        Sincronizado: <span id="hora">--:--</span>
      </div>
    </div>
  </div>

  <script>
    let trmGlobal = 0;
    const nf = new Intl.NumberFormat('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    async function update() {
      // Intentamos obtener la TRM directamente del Gobierno usando 2 proxies diferentes para saltar el firewall
      const govUrl = "https://www.datos.gov.co/resource/m97w-rn6u.json?$limit=1&$order=vigenciadesde%20DESC";
      const estrategias = [
        `https://corsproxy.io/?${encodeURIComponent(govUrl)}`,
        `https://api.allorigins.win/get?url=${encodeURIComponent(govUrl)}`
      ];

      for (let url of estrategias) {
        try {
          const response = await fetch(url + "&cb=" + Date.now());
          const rawData = await response.json();
          
          // Ajuste para AllOrigins que envuelve el resultado
          const data = rawData.contents ? JSON.parse(rawData.contents) : rawData;

          if (data && data[0]) {
            trmGlobal = parseFloat(data[0].valor);
            document.getElementById('trm-display').innerText = "$ " + nf.format(trmGlobal);
            document.getElementById('fecha-display').innerText = "Vigencia: " + data[0].vigenciadesde.split('T')[0];
            document.getElementById('fuente').innerText = "Superfinanciera (Directo)";
            document.getElementById('hora').innerText = new Date().toLocaleTimeString('es-CO', {hour: '2-digit', minute: '2-digit', hour12: true});
            return; // Si funciona, nos detenemos aquí
          }
        } catch (e) {
          console.error("Fallo estrategia, intentando siguiente...");
        }
      }
      
      // Si todo lo anterior falla, usamos un valor de emergencia dinámico (Mercado en vivo)
      try {
        const res = await fetch("https://open.er-api.com/v6/latest/USD");
        const d = await res.json();
        trmGlobal = d.rates.COP;
        document.getElementById('trm-display').innerText = "$ " + nf.format(trmGlobal);
        document.getElementById('fecha-display').innerText = "Vigencia: " + new Date().toLocaleDateString('es-CO');
        document.getElementById('fuente').innerText = "Mercado Financiero (Respaldo)";
      } catch (err) {
        document.getElementById('trm-display').innerText = "Error";
        document.getElementById('fecha-display').innerText = "Sin conexión";
      }
    }

    function convertir(tipo) {
      if(!trmGlobal) return;
      const u = document.getElementById('usd'), c = document.getElementById('cop');
      if(tipo === 'usd') c.value = u.value > 0 ? nf.format(u.value * trmGlobal) : "";
      else {
        let p = c.value.replace(/\./g, '').replace(/,/g, '.');
        u.value = p > 0 ? (p / trmGlobal).toFixed(2) : "";
      }
    }

    update();
    setInterval(update, 1800000); // Reintentar cada 30 minutos
  </script>
</body>
</html>
