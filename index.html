<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: transparent; display: flex; justify-content: center; padding: 10px 0; }
    .container { width: 100%; max-width: 270px; display: flex; flex-direction: column; gap: 10px; }
    .card { background: #06182c; color: white; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #102a43; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #829ab1; font-weight: 700; margin-bottom: 5px; }
    .value { font-size: 32px; font-weight: 800; color: #ffffff; line-height: 1; margin-bottom: 5px; }
    .info { font-size: 10px; color: #00f2fe; font-weight: 600; }
    .calc-box { background: #0a192f; padding: 15px; border-radius: 12px; border: 1px solid #102a43; }
    .input-group { margin-bottom: 10px; text-align: left; }
    .input-group label { display: block; font-size: 9px; color: #627d98; margin-bottom: 3px; text-transform: uppercase; }
    .input-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #1e293b; background: #112240; color: white; font-size: 16px; box-sizing: border-box; outline: none; }
    .footer { font-size: 8px; color: #475569; text-align: center; margin-top: 10px; border-top: 1px solid #102a43; padding-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="label">TRM Hoy (Wilkinson Bridge)</div>
      <div class="value" id="trm-val">$ 0,00</div>
      <div class="info" id="trm-date">Sincronizando...</div>
    </div>
    <div class="calc-box">
      <div class="input-group">
        <label>Dólares (USD)</label>
        <input type="number" id="usd" placeholder="0.00" oninput="convertir()">
      </div>
      <div class="input-group">
        <label>Pesos (COP)</label>
        <input type="text" id="cop" placeholder="$ 0" readonly>
      </div>
      <div class="footer">Fuente: WilkinsonPC Sync<br>Sinc: <span id="trm-time">--:--</span></div>
    </div>
  </div>
  <script>
    let rate = 0;
    function update() {
      // Forzamos la actualización sin caché
      fetch("https://curly-violet-2d33.cdiaz-sac.workers.dev/?nocache=" + Date.now())
        .then(r => r.json())
        .then(d => {
          if (d.trm) {
            rate = d.trm;
            document.getElementById('trm-val').innerText = "$ " + d.trm_formateada;
            document.getElementById('trm-date').innerText = "Vigencia: " + d.fecha;
            document.getElementById('trm-time').innerText = d.hora;
          }
        });
    }
    function convertir() {
      const usd = document.getElementById('usd').value;
      const cop = document.getElementById('cop');
      if (usd > 0 && rate > 0) {
        cop.value = "$ " + Math.round(usd * rate).toLocaleString('es-CO');
      } else { cop.value = ""; }
    }
    update();
    setInterval(update, 600000); // Revisa cada 10 min si Wilkinson cambió el dato
  </script>
</body>
</html>
