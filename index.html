<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    :root { --accent: #00f2fe; --bg: #06182c; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: transparent; display: flex; justify-content: center; padding: 10px; overflow: hidden; }
    .container { width: 100%; max-width: 280px; display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--bg); color: white; padding: 22px; border-radius: 15px; text-align: center; border: 1px solid #102a43; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
    .label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #829ab1; font-weight: 700; }
    .value { font-size: 36px; font-weight: 800; color: #ffffff; margin: 8px 0; }
    .vigencia { font-size: 11px; color: var(--accent); font-weight: 600; }
    .calc { background: #0a192f; padding: 18px; border-radius: 15px; border: 1px solid #102a43; color: white; }
    input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #1e293b; background: #112240; color: white; font-size: 16px; box-sizing: border-box; outline: none; margin-top: 5px; }
    .footer { font-size: 9px; color: #627d98; text-align: center; margin-top: 10px; border-top: 1px solid #102a43; padding-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="label">TRM OFICIAL COLOMBIA</div>
      <div id="trm-display" class="value">$ 3.221,41</div>
      <div id="fecha-display" class="vigencia">Vigencia: 2026-07-17</div>
    </div>
    <div class="calc">
      <input type="number" id="usd" placeholder="Dólares (USD)" oninput="convertir('usd')">
      <input type="text" id="cop" placeholder="Pesos (COP)" oninput="convertir('cop')">
      <div class="footer">Fuente: SFC (Smart Sync) | <span id="hora">--:--</span></div>
    </div>
  </div>

  <script>
    // PEGA AQUÍ TU URL DE GOOGLE SCRIPT V2
    const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbzxqRogzTGTcaCXk4wnGz8fUroj1AqFr1SfSzEOT9CFbkovFvX9C5nuU8JSWY_K-sxZ/exec";
    
    let trmGlobal = 3221.41; // Valor de hoy por seguridad
    const nf = new Intl.NumberFormat('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    async function update() {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 6000); // 6 segundos máximo

      try {
        const res = await fetch(GOOGLE_URL, { signal: controller.signal });
        const data = await res.json();
        
        // Manejar formatos de Google
        let rawTrm = data.valor || (data[0] ? data[0].valor : null);
        let rawFecha = data.vigencia || (data[0] ? data[0].vigenciadesde.split('T')[0] : null);

        if (rawTrm) {
          trmGlobal = parseFloat(rawTrm);
          document.getElementById('trm-display').innerText = "$ " + nf.format(trmGlobal);
          document.getElementById('fecha-display').innerText = "Vigencia: " + rawFecha;
          document.getElementById('hora').innerText = new Date().toLocaleTimeString('es-CO', {hour:'2-digit', minute:'2-digit', hour12:true});
        }
      } catch (e) {
        console.log("Usando respaldo local por lentitud de red");
        // No hacemos nada, se queda con el valor de respaldo 3.221,41
      }
    }

    function convertir(tipo) {
      const u = document.getElementById('usd'), c = document.getElementById('cop');
      if(tipo === 'usd') c.value = u.value > 0 ? nf.format(u.value * trmGlobal) : "";
      else {
        let p = c.value.replace(/\./g, '').replace(/,/g, '.');
        u.value = p > 0 ? (p / trmGlobal).toFixed(2) : "";
      }
    }

    update();
    setInterval(update, 1800000);
  </script>
</body>
</html>
