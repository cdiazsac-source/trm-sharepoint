<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    :root { --accent: #00f2fe; --bg: #06182c; }
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: transparent; display: flex; justify-content: center; padding: 10px; }
    .card { background: var(--bg); color: white; padding: 25px; border-radius: 15px; text-align: center; border: 1px solid #102a43; width: 280px; }
    .label { font-size: 10px; text-transform: uppercase; color: #829ab1; font-weight: 700; }
    .value { font-size: 38px; font-weight: 800; color: #ffffff; margin: 10px 0; }
    .vigencia { font-size: 11px; color: var(--accent); }
    .calc { background: #0a192f; padding: 15px; border-radius: 15px; border: 1px solid #102a43; margin-top: 10px; color: white; }
    input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #1e293b; background: #112240; color: white; font-size: 16px; box-sizing: border-box; outline: none; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="card">
    <div class="label">TRM OFICIAL COLOMBIA</div>
    <div id="trm-display" class="value">...</div>
    <div id="fecha-display" class="vigencia">Sincronizando con SharePoint...</div>
    
    <div class="calc">
        <input type="number" id="usd" placeholder="Dólares (USD)" oninput="convertir('usd')">
        <input type="text" id="cop" placeholder="Pesos (COP)" oninput="convertir('cop')">
    </div>
</div>

<script>
    let trmGlobal = 0;
    const nf = new Intl.NumberFormat('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    async function loadFromSharePoint() {
        // Esta URL apunta a tu lista interna de SharePoint
        const listUrl = "/_api/web/lists/getbytitle('ConfiguracionTRM')/items(1)";
        
        try {
            const response = await fetch(listUrl, {
                headers: { "accept": "application/json;odata=verbose" }
            });
            const data = await response.json();
            trmGlobal = parseFloat(data.d.Valor);
            
            document.getElementById('trm-display').innerText = "$ " + nf.format(trmGlobal);
            document.getElementById('fecha-display').innerText = "Vigencia: " + new Date().toLocaleDateString();
        } catch (e) {
            document.getElementById('trm-display').innerText = "Error";
            document.getElementById('fecha-display').innerText = "Verifica permisos de la lista";
        }
    }

    function convertir(tipo) {
        if(!trmGlobal) return;
        const u = document.getElementById('usd'), c = document.getElementById('cop');
        if(tipo === 'usd') c.value = u.value > 0 ? nf.format(u.value * trmGlobal) : "";
        else {
            let p = c.value.replace(/\./g, '').replace(/,/g, '.');
            u.value = p > 0 ? (p / trmGlobal).toFixed(2) : "";
        }
    }
    loadFromSharePoint();
</script>
</body>
</html>
